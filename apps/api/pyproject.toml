[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odei-studio-api"
version = "0.1.0"
description = "Backend foundation for ODEI Studio and ODEI NEXUS"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.5,<3.0",
  "pathspec>=0.12,<2.0",
  "openai>=2.0,<4.0",
  "pymongo>=4.13,<5.0",
  "PyJWT[crypto]>=2.9,<3.0",
]

[project.scripts]
odei-companion = "odei_api.companion:main"
odei-execution-worker = "odei_api.execution_worker:main"
odei-mac-revision-migration = "odei_api.mac_revision_migration:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10.0",
  "httpx>=0.27,<1.0",
  "httpx2>=2.14,<3",
  "pytest-asyncio>=0.24,<2.0",
  "ruff>=0.9,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["odei_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff.lint.isort]
known-first-party = ["odei_api"]

[tool.ruff]
line-length = 100
target-version = "py310"
