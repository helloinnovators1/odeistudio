name: Bootstrap deterministic web lockfile

on:
  push:
    branches: [chore/deterministic-web-lockfile]
    paths:
      - "apps/web/package.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-lockfile-bootstrap
  cancel-in-progress: false

jobs:
  generate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: chore/deterministic-web-lockfile
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Pin npm toolchain
        run: |
          npm install --global npm@10.9.4
          test "$(npm --version)" = "10.9.4"
      - name: Generate the committed lockfile
        working-directory: apps/web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile is already current."
          else
            git commit -m "build(web): generate deterministic npm lockfile"
            git push origin HEAD:chore/deterministic-web-lockfile
          fi
      - name: Install exactly from lockfile
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Run web unit tests
        working-directory: apps/web
        run: npm test
      - name: Build web application
        working-directory: apps/web
        run: npm run build
      - name: Audit locked web dependencies
        working-directory: apps/web
        run: npm audit --audit-level=high
