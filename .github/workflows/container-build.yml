name: API Container Build

on:
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/container-build.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/container-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build API image
        run: docker build --pull --tag odei-api:ci ./apps/api
      - name: Verify image runs as non-root
        run: |
          test "$(docker image inspect odei-api:ci --format '{{.Config.User}}')" = "10001:10001"
      - name: Start API with read-only filesystem and dropped capabilities
        run: |
          docker run --detach --name odei-api-ci \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 128 \
            --memory 512m \
            --cpus 1 \
            -p 127.0.0.1:8000:8000 \
            odei-api:ci
      - name: Verify liveness and fail-closed readiness
        run: |
          python - <<'PY'
          import time
          import urllib.error
          import urllib.request

          for attempt in range(30):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8000/api/v1/health/live", timeout=2) as response:
                      assert response.status == 200
                      break
              except Exception:
                  if attempt == 29:
                      raise
                  time.sleep(1)
          else:
              raise RuntimeError("API did not become live")

          try:
              urllib.request.urlopen("http://127.0.0.1:8000/api/v1/health/ready", timeout=2)
          except urllib.error.HTTPError as error:
              assert error.code == 503, f"Expected fail-closed readiness 503, got {error.code}"
          else:
              raise AssertionError("Readiness must fail closed when MongoDB is not configured")
          PY
      - name: Show container diagnostics on failure
        if: failure()
        run: docker logs odei-api-ci || true
      - name: Stop API container
        if: always()
        run: docker rm --force odei-api-ci || true
